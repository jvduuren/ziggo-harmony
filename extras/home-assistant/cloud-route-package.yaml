# Alternative without extra hardware: Harmony Hub -> Home Assistant -> Ziggo cloud -> Next Mini
#
# Chain: Harmony Hub --(Roku ECP over Wi-Fi)--> HA "Emulated Roku"
#        --> roku_command event --> these automations
#        --> lghorizon.remote_key_press --(Ziggo cloud/MQTT)--> Next Mini
#
# Slower than the ESP32 bridge (every key press goes through the cloud) and limited to the
# keys a Roku has, hence three emulated Rokus. Not tested end to end.
#
# Requires in Home Assistant:
#   - LG Horizon (HACS, Sholofly/lghorizon), provider Ziggo
#   - Emulated Roku with three servers, names exactly as in the keymap below:
#       "Ziggo Nav" port 8060, "Ziggo Extra" port 8061, "Ziggo Cijfers" port 8062
#   - Logitech Harmony integration (power on/off follows the Harmony activity)
#
# Use as a package: in configuration.yaml
#   homeassistant:
#     packages: !include_dir_named packages
# and put this file in /config/packages/.

automation:
  - id: ziggo_harmony_roku_bridge
    alias: "Ziggo Next Mini – Harmony buttons (emulated Roku)"
    mode: queued
    max: 25
    max_exceeded: silent
    triggers:
      - trigger: event
        event_type: roku_command
        event_data:
          type: keypress
    variables:
      ziggo: media_player.ziggo_next_mini # adjust to your own entity
      keymap:
        # Roku command (as sent by Harmony) -> Ziggo key
        "Ziggo Nav":
          Up: ArrowUp
          Down: ArrowDown
          Left: ArrowLeft
          Right: ArrowRight
          Select: Enter
          Back: Escape
          Home: MediaTopMenu
          Info: Info
          Play: MediaPlayPause
          Rev: MediaRewind
          Fwd: MediaFastForward
          InstantReplay: TV
          Search: Guide
        "Ziggo Extra":
          Up: ChannelUp
          Down: ChannelDown
          Select: MediaRecord
          Back: MediaStop
          Home: ContextMenu
          Info: Subtitle
          Search: Teletext
          InstantReplay: AudioTrack
          Left: Red
          Right: Green
          Rev: Yellow
          Fwd: Blue
        "Ziggo Cijfers":
          Up: "1"
          Down: "2"
          Left: "3"
          Right: "4"
          Select: "5"
          Back: "6"
          Home: "7"
          Info: "8"
          Play: "9"
          Rev: "0"
      ziggo_key: >-
        {{ keymap.get(trigger.event.data.source_name, {})
                 .get(trigger.event.data.key, '') }}
    conditions:
      - condition: template
        value_template: "{{ ziggo_key | string | length > 0 }}"
    actions:
      - action: lghorizon.remote_key_press
        target:
          entity_id: "{{ ziggo }}"
        data:
          remote_key: "{{ ziggo_key }}"

  - id: ziggo_harmony_power
    alias: "Ziggo Next Mini – power follows Harmony activity"
    mode: restart
    triggers:
      - trigger: state
        entity_id: remote.harmony_hub # adjust to your own entity
        attribute: current_activity
    variables:
      ziggo: media_player.ziggo_next_mini
      tv_activity: "TV kijken" # name of your Harmony activity
      activity: "{{ trigger.to_state.attributes.current_activity }}"
    actions:
      - choose:
          - conditions: "{{ activity == tv_activity }}"
            sequence:
              - action: media_player.turn_on
                target:
                  entity_id: "{{ ziggo }}"
          - conditions: "{{ trigger.from_state.attributes.current_activity == tv_activity }}"
            sequence:
              - action: media_player.turn_off
                target:
                  entity_id: "{{ ziggo }}"
