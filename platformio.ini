; ziggo-harmony — IR (e.g. Logitech Harmony) to BLE bridge for the Ziggo Mediabox Next Mini
; https://github.com/jvduuren/ziggo-harmony

[platformio]
default_envs = waveshare-esp32-s3-zero

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
extra_scripts = post:tools/pio_factory_bin.py
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    crankyoldgit/IRremoteESP8266@2.8.6
    tzapu/WiFiManager@2.0.17
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DIR_PIN=1

; Waveshare ESP32-S3-Zero (ESP32-S3FH4R2, 4 MB flash, WS2812 RGB LED on GPIO21)
[env:waveshare-esp32-s3-zero]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_WS2812_PIN=21
    -DLED_SWAP_RG=1

; Seeed Studio XIAO ESP32S3 (8 MB flash, single user LED on GPIO21, active low)
[env:seeed-xiao-esp32s3]
board = seeed_xiao_esp32s3
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_GPIO_PIN=21
    -DLED_ACTIVE_LOW=1
